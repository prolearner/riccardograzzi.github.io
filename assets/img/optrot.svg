<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 636" role="img" aria-labelledby="title desc">
  <title id="title">OptRot teaser</title>
  <desc id="desc">Weight outliers are rotated into a more balanced distribution before quantization.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="rot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#431407" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1448" height="636" rx="44" fill="url(#bg)"/>
  <g opacity="0.32">
    <circle cx="203" cy="126" r="92" fill="#fed7aa"/>
    <circle cx="1258" cy="528" r="132" fill="#fdba74"/>
  </g>
  <g transform="translate(160 134)" filter="url(#shadow)">
    <rect x="0" y="0" width="390" height="330" rx="28" fill="#ffffff"/>
    <line x1="58" y1="278" x2="338" y2="278" stroke="#9ca3af" stroke-width="4"/>
    <line x1="58" y1="278" x2="58" y2="50" stroke="#9ca3af" stroke-width="4"/>
    <g fill="#f97316">
      <circle cx="94" cy="248" r="13"/>
      <circle cx="130" cy="231" r="11"/>
      <circle cx="170" cy="220" r="12"/>
      <circle cx="210" cy="205" r="13"/>
      <circle cx="248" cy="187" r="11"/>
      <circle cx="288" cy="160" r="12"/>
      <circle cx="326" cy="78" r="18"/>
    </g>
  </g>
  <g transform="translate(898 134)" filter="url(#shadow)">
    <rect x="0" y="0" width="390" height="330" rx="28" fill="#ffffff"/>
    <line x1="58" y1="278" x2="338" y2="278" stroke="#9ca3af" stroke-width="4"/>
    <line x1="58" y1="278" x2="58" y2="50" stroke="#9ca3af" stroke-width="4"/>
    <g fill="#16a34a">
      <circle cx="98" cy="220" r="13"/>
      <circle cx="132" cy="207" r="11"/>
      <circle cx="168" cy="193" r="12"/>
      <circle cx="204" cy="178" r="13"/>
      <circle cx="240" cy="165" r="11"/>
      <circle cx="276" cy="150" r="12"/>
      <circle cx="312" cy="136" r="13"/>
    </g>
  </g>
  <g transform="translate(626 220)">
    <circle cx="98" cy="98" r="88" fill="url(#rot)" filter="url(#shadow)"/>
    <path d="M56 89 C63 55 95 36 130 47 C152 54 166 70 173 88" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
    <path d="M174 59 L177 94 L143 82" fill="#ffffff"/>
    <path d="M140 109 C134 143 102 162 67 151 C45 144 31 128 24 110" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
    <path d="M23 139 L20 104 L54 116" fill="#ffffff"/>
  </g>
  <text x="724" y="85" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="900" fill="#431407">OptRot</text>
  <text x="724" y="548" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="800" fill="#7c2d12">data-free rotations for post-training quantization</text>
  <text x="356" y="512" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700" fill="#9a3412">outlier-heavy weights</text>
  <text x="1092" y="512" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700" fill="#166534">quantization-friendly weights</text>
</svg>
