<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 636" role="img" aria-labelledby="title desc">
  <title id="title">Learning state-tracking from code teaser</title>
  <desc id="desc">A REPL trace reveals program state while a linear recurrent model tracks hidden variables.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="1448" height="636" rx="44" fill="url(#bg)"/>
  <path d="M0 465 C244 532 371 378 577 434 C762 484 861 565 1038 501 C1192 445 1306 320 1448 363 L1448 636 L0 636 Z" fill="#c7d2fe" opacity="0.62"/>
  <g transform="translate(114 122)" filter="url(#shadow)">
    <rect width="560" height="378" rx="30" fill="url(#panel)"/>
    <circle cx="48" cy="42" r="12" fill="#ef4444"/>
    <circle cx="84" cy="42" r="12" fill="#f59e0b"/>
    <circle cx="120" cy="42" r="12" fill="#22c55e"/>
    <text x="54" y="112" font-family="Ubuntu Mono, Menlo, monospace" font-size="30" fill="#a7f3d0">&gt;&gt;&gt; x = 3</text>
    <text x="54" y="166" font-family="Ubuntu Mono, Menlo, monospace" font-size="30" fill="#bfdbfe">&gt;&gt;&gt; x = f(x)</text>
    <text x="54" y="220" font-family="Ubuntu Mono, Menlo, monospace" font-size="30" fill="#fde68a">&gt;&gt;&gt; print(x)</text>
    <text x="54" y="274" font-family="Ubuntu Mono, Menlo, monospace" font-size="30" fill="#ffffff">state: 7</text>
    <text x="54" y="328" font-family="Ubuntu Mono, Menlo, monospace" font-size="30" fill="#bfdbfe">&gt;&gt;&gt; x = g(x)</text>
  </g>
  <g transform="translate(804 145)">
    <circle cx="114" cy="90" r="62" fill="#4f46e5" filter="url(#shadow)"/>
    <circle cx="276" cy="90" r="62" fill="#7c3aed" filter="url(#shadow)"/>
    <circle cx="195" cy="235" r="62" fill="#0891b2" filter="url(#shadow)"/>
    <path d="M176 90 L214 90" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    <path d="M250 144 L220 186" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    <path d="M170 186 L140 144" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    <text x="114" y="101" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff">hₜ</text>
    <text x="276" y="101" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff">hₜ₊₁</text>
    <text x="195" y="246" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff">ŷ</text>
    <rect x="28" y="330" width="334" height="58" rx="29" fill="#ffffff" opacity="0.88"/>
    <text x="195" y="370" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#1e1b4b">linear RNN tracking</text>
  </g>
  <path d="M690 312 C746 311 779 301 833 268" fill="none" stroke="#4f46e5" stroke-width="9" stroke-linecap="round"/>
  <path d="M820 249 L856 253 L836 284" fill="#4f46e5"/>
  <text x="724" y="82" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="50" font-weight="900" fill="#111827">Learning State-Tracking from Code</text>
  <text x="724" y="570" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#3730a3">REPL traces · state reveals · sequence models</text>
</svg>
